# Local Postgres for development and integration tests.
# Production runs on Supabase (EU region) — see docs/08.
services:
  db:
    image: postgres:16-alpine
    container_name: nod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nod
    ports:
      - '5432:5432'
    volumes:
      - nod-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nod']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  nod-pgdata:
